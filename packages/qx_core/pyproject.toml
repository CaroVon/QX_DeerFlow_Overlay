[project]
name = "qx-core"
version = "0.1.0"
description = "QX 必迁 v1 子集：三层知识库（Chroma+BM25 混合检索）、文档解析（抽取自 QX app/rag，import 前缀重写为 qx_core）"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.15,<2",
    "langchain-community>=0.4",
    "langchain-chroma>=1.1",
    "langchain-text-splitters>=1.1",
    "sentence-transformers>=5.5",
    "chromadb>=1.5",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qx_core"]
