[project]
name = "qx-mcp"
version = "0.1.0"
description = "QX Product Studio 的 MCP 服务：把 studio 长任务管线以 submit/status/cancel 工具暴露给 DeerFlow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qx_mcp"]

[project.scripts]
qx-mcp = "qx_mcp.server:main"
