[project]
name = "qx-tools"
version = "0.1.0"
description = "QX 能力的 DeerFlow 工具封装：亚马逊竞品矩阵（MOD）、竞品采集、知识检索等"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.15,<2",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "requests>=2.31",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qx_tools"]
