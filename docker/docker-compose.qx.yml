# QX × DeerFlow 集成拓扑固化（当前验证态的声明式描述）
#
# 用法：与 deer-flow 官方 compose 叠加
#   docker compose -f deer-flow/docker/docker-compose.yaml -f docker/docker-compose.qx.yml up -d
#
# 说明：
# - gateway/frontend 的构建与官方一致，仅通过环境注入 qx 扩展（editable 包 + 配置）。
# - df-nginx 用叠加配置 docker/nginx-qx.conf（官方 conf 生成：upstream 改
#   host.docker.internal + 追加 /api/qx/ 业务路由）。
# - QX 侧（api/worker/postgres/redis）沿用 QX_product_agent/docker-compose.yml。
#   qx-mcp 不需要独立容器：由 gateway 以 stdio 子进程拉起（extensions_config.json）。

services:
  nginx:
    container_name: df-nginx
    image: nginx:1.27-alpine
    ports:
      - "2026:2026"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 注意：多 compose 叠加时相对路径按首个文件目录解析，故此处用绝对路径
      - ${QX_OVERLAY_ROOT:-/home/administrator/dev/agents/qx-deerflow}/deer-flow:/repo:ro
      - ${QX_OVERLAY_ROOT:-/home/administrator/dev/agents/qx-deerflow}/docker/nginx-qx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      # 服务间认证密钥（R4）：envsubst 注入 /api/qx/ 的服务身份头
      QX_SERVICE_KEY: ${QX_SERVICE_KEY:-}
    # 只替换 QX_SERVICE_KEY 一个变量（nginx 内置 $http_cookie 等必须原样保留）
    command: >
      sh -c "envsubst '$$QX_SERVICE_KEY' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && exec nginx -c /etc/nginx/nginx.conf -p /repo/ -g 'daemon off;'"
    restart: unless-stopped

  gateway:
    environment:
      QX_SOURCES_DIR: ${QX_SOURCES_DIR:-/home/administrator/dev/agents}
      QX_OUTPUT_DIR: ${QX_OUTPUT_DIR:-/home/administrator/dev/agents/qx-deerflow/runtime/outputs}
      QX_MOD_SOURCE: ${QX_MOD_SOURCE:-rainforest}
      QX_API_BASE: http://host.docker.internal:8000
      QX_MCP_MODE: direct
      QX_BACKEND_DIR: /home/administrator/dev/agents/QX_product_agent/backend
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:2026}
